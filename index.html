<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strabismus Detection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 40px;
    }
    .upload-box {
      margin: 20px auto;
      padding: 25px;
      width: 350px;
      background: white;
      border-radius: 10px;
      border: 2px dashed #888;
    }
    #filePreview {
      margin-top: 20px;
      max-width: 300px;
      display: none;
    }
    #loading {
      display: none;
      margin: 20px 0;
    }
    #results {
      display: none;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      max-width: 800px;
      text-align: left;
    }
    .result-item {
      margin: 10px 0;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 5px;
    }
    .visualization-container {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      flex-wrap: wrap;
      gap: 20px;
    }
    .eye-canvas {
      border: 2px solid #ddd;
      border-radius: 8px;
      max-width: 300px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px;
    }
    button:hover {
      background: #0056b3;
    }
    button:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }
    h3 {
      margin-top: 20px;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>🩺 Strabismus Detection</h1>
  <p>Upload eye image for pupil position analysis</p>
  
  <div class="upload-box">
    <p>Select an image</p>
    <input type="file" id="fileInput" accept="image/*" />
    <p id="fileInfo"></p>
    <img id="filePreview" />
    
    <div id="loading">
      <p>🔄 Analyzing image... Please wait</p>
    </div>
  </div>
  
  <button id="analyzeBtn" disabled>Analyze Image</button>
  
  <div id="results">
    <h2>📊 Analysis Result</h2>
    <div id="resultContent"></div>
    
    <h3>👁️ Eye Detection Visualization</h3>
    <div class="visualization-container">
      <div>
        <h4>Left Eye</h4>
        <canvas id="leftEyeCanvas"></canvas>
      </div>
      <div>
        <h4>Right Eye</h4>
        <canvas id="rightEyeCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Load script.js FIRST -->
  <script src="script.js"></script>
  
  <!-- Load OpenCV.js AFTER script.js -->
  <script>
    var Module = {
      onRuntimeInitialized: function() {
        console.log("OpenCV.js runtime initialized");
        // Panggil onOpenCvReady setelah runtime siap
        if (typeof onOpenCvReady === 'function') {
          onOpenCvReady();
        }
      }
    };
  </script>
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</body>
</html>
